name: Windows

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'android/app/src/main/java/uz/reaktivombor/domain/**'
      - '.github/workflows/desktop.yml'
    tags:
      - 'desktop-v*'
  pull_request:
    paths:
      - 'desktop/**'
      - 'android/app/src/main/java/uz/reaktivombor/domain/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew --no-daemon test

  msi:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI installer and portable app
        run: |
          # Har yig'ish yangi versiya: aks holda yangi MSI eskisining ustiga o'rnatilmaydi (Windows Installer 1638).
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then V="${GITHUB_REF_NAME#desktop-v}"; else V="1.0.${{ github.run_number }}"; fi
          echo "Versiya: $V"
          ./gradlew --no-daemon packageMsi createDistributable -PappVersion="$V"
      - name: Check bundled runtime (no app-local UCRT)
        run: |
          ls build/compose/binaries/main/app/Reaktivlar/runtime/bin
          if ls build/compose/binaries/main/app/Reaktivlar/runtime/bin | grep -iE '^(ucrtbase\.dll|api-ms-win-)'; then
            echo "::error::UCRT DLL’lari runtime ichida qolib ketgan"; exit 1
          fi
      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path build/compose/binaries/main/app/Reaktivlar -DestinationPath build/Reaktivlar-portable.zip
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: Reaktivlar-Windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Reaktivlar-Windows-portable
          path: desktop/build/Reaktivlar-portable.zip
          if-no-files-found: error
      - name: Attach to release (desktop-v* tag)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/Reaktivlar-portable.zip

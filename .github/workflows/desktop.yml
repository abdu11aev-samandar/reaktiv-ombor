name: Windows

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'android/app/src/main/java/uz/reaktivombor/domain/**'
      - '.github/workflows/desktop.yml'
    tags:
      - 'desktop-v*'
  pull_request:
    paths:
      - 'desktop/**'
      - 'android/app/src/main/java/uz/reaktivombor/domain/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Testlar Linux’da ham, Windows’da ham: SQLite kutubxonasi, shriftlar va fayl yo‘llari ikkalasida tekshiriladi.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew --no-daemon test
      # Topshiriq 18-bandi: har bir testning haqiqiy natijasi (ishga tushmagani «o‘tdi» deb yozilmaydi).
      # Faqat Linux’da: skript ✅/❌ chiqaradi, Windows Python’ining stdout’i UTF-8 bo‘lmasligi mumkin.
      - name: Test results report (TEST-RESULTS.md)
        if: always() && matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p build
          python3 scripts/test_results.py > build/TEST-RESULTS.md
          cat build/TEST-RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: |
            desktop/build/reports/tests/test/
            desktop/build/test-results/test/*.xml
            desktop/build/TEST-RESULTS.md
          if-no-files-found: ignore

  deb:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      # Temurin kutubxonalarni (libjpeg va h.k.) o'zi bilan olib yuradi — paket Debian/Kali'da ham o'rnatiladi.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build .deb (Debian, Ubuntu, Kali, Mint)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot
          # Teg bo'lsa ham: har yig'ish yagona va o'sib boruvchi versiya oladi (teg faqat release nomi).
          V="2.0.${{ github.run_number }}"
          echo "Versiya: $V"
          ./gradlew --no-daemon packageDeb -PappVersion="$V"
      - name: Install, self-test and remove
        run: |
          sudo apt-get install -y ./build/compose/binaries/main/deb/*.deb
          test -x /opt/reaktivcontrol/bin/ReaktivControl
          # O'rnatilgan dasturning o'zi: baza, kirim/sarf, hisobotlar (Excel, PDF), zaxira va tiklash.
          /opt/reaktivcontrol/bin/ReaktivControl --self-test "$RUNNER_TEMP/selftest-deb.txt" || { cat "$RUNNER_TEMP/selftest-deb.txt"; exit 1; }
          cat "$RUNNER_TEMP/selftest-deb.txt"
          sudo apt-get purge -y reaktivcontrol
      - name: Install test on Debian 12 (eski kutubxona nomlari)
        run: |
          docker run --rm -v "$PWD/build/compose/binaries/main/deb:/d" debian:12 \
            sh -c 'apt-get update -qq && apt-get install -y -qq /d/*.deb && test -x /opt/reaktivcontrol/bin/ReaktivControl'
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: ReaktivControl-Linux-deb
          path: desktop/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error
      - name: Attach to release (desktop-v* tag)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/build/compose/binaries/main/deb/*.deb

  msi:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI installer and portable app
        run: |
          # Har yig'ish yangi versiya: aks holda yangi MSI eskisining ustiga o'rnatilmaydi (Windows Installer 1638).
          # Teg bo'lsa ham: har yig'ish yagona va o'sib boruvchi versiya oladi (teg faqat release nomi).
          V="2.0.${{ github.run_number }}"
          echo "Versiya: $V"
          ./gradlew --no-daemon packageMsi createDistributable -PappVersion="$V"
      - name: Check bundled runtime (no app-local UCRT)
        run: |
          ls build/compose/binaries/main/app/ReaktivControl/runtime/bin
          if ls build/compose/binaries/main/app/ReaktivControl/runtime/bin | grep -iE '^(ucrtbase\.dll|api-ms-win-)'; then
            echo "::error::UCRT DLL’lari runtime ichida qolib ketgan"; exit 1
          fi
      - name: Self-test of the portable EXE
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'selftest-portable.txt'
          $exe = Resolve-Path 'build/compose/binaries/main/app/ReaktivControl/ReaktivControl.exe'
          $p = Start-Process -FilePath $exe -ArgumentList @('--self-test', "`"$out`"") -Wait -PassThru
          if (Test-Path $out) { Get-Content $out -Encoding UTF8 }
          if ($p.ExitCode -ne 0) { Write-Error "Self-test muvaffaqiyatsiz: $($p.ExitCode)"; exit 1 }
      # Windows foydalanuvchi nomida lotin bo'lmagan harflar (kirill, Ғ/Қ/Ҳ): %TEMP% ham shunday papkada bo'ladi.
      # sqlite-jdbc DLL'ini %TEMP% ga chiqaradi, JVM esa DLL yo'lini tizim kod sahifasiga (bu yerda Cp1252) o'giradi —
      # dastur buni sezib, kutubxonani ASCII papkaga (%ProgramData%\ReaktivControl\native) chiqarishi kerak.
      - name: Self-test with TEMP/TMP in a folder with Cyrillic letters and spaces
        shell: pwsh
        timeout-minutes: 5
        run: |
          # "Ғайрат Темп" — kod nuqtalaridan (skript faylining kodlashiga bog'liq bo'lmasin).
          $name = [string]::new([char[]]@(0x0492, 0x0430, 0x0439, 0x0440, 0x0430, 0x0442, 0x20, 0x0422, 0x0435, 0x043C, 0x043F))
          $tmp = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $env:TEMP = $tmp
          $env:TMP = $tmp
          Write-Host "TEMP=$env:TEMP"
          $out = Join-Path $env:RUNNER_TEMP 'selftest-unicode-temp.txt'
          $exe = Resolve-Path 'build/compose/binaries/main/app/ReaktivControl/ReaktivControl.exe'
          $p = Start-Process -FilePath $exe -ArgumentList @('--self-test', "`"$out`"") -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; Write-Error "Self-test 180 s ichida tugamadi"; exit 1 }
          if (Test-Path $out) { Get-Content $out -Encoding UTF8 } else { Write-Error "Self-test natija fayli yozilmadi"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "Lotin bo'lmagan %TEMP% bilan self-test o'tmadi: $($p.ExitCode)"; exit 1 }
          if (-not (Select-String -Path $out -Encoding UTF8 -SimpleMatch -Pattern '(org.sqlite.tmpdir)' -Quiet)) {
            Write-Error "SQLite kutubxonasi ASCII papkaga yo'naltirilmadi"; exit 1
          }
      # Dastur papkasining o'zi lotin bo'lmagan harfli yo'lda (masalan, C:\Users\Ғайрат\AppData\Local\ReaktivControl).
      # jpackage ishga tushirgichi (JDK 17) yo'lni tizim kod sahifasiga o'giradi (JDK-8205991) — shuning uchun README
      # bunday kompyuterda C:\ReaktivControl ga o'rnatishni aytadi. Bu qadam shu cheklovni har yig'ishda tekshiradi:
      # dastur ishga tushib self-test yiqilsa — xato; ishga tushirgichning o'zi ochilmasa — ogohlantirish (ma'lum cheklov).
      - name: Portable app copied to a folder with Cyrillic letters and spaces
        shell: pwsh
        timeout-minutes: 5
        run: |
          # "C:\Тест Ғайрат\ReaktivControl" — kod nuqtalaridan.
          $name = [string]::new([char[]]@(0x0422, 0x0435, 0x0441, 0x0442, 0x20, 0x0492, 0x0430, 0x0439, 0x0440, 0x0430, 0x0442))
          $root = Join-Path 'C:\' $name
          $dir = Join-Path $root 'ReaktivControl'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item -Recurse -Force -Path 'build/compose/binaries/main/app/ReaktivControl' -Destination $dir
          $exe = Join-Path $dir 'ReaktivControl.exe'
          if (-not (Test-Path -LiteralPath $exe)) { Write-Error "Nusxa olinmadi: $exe"; exit 1 }
          Write-Host "Dastur: $exe"
          $out = Join-Path $env:RUNNER_TEMP 'selftest-cyrillic-folder.txt'
          $p = Start-Process -FilePath $exe -ArgumentList @('--self-test', "`"$out`"") -PassThru
          $null = $p.Handle
          $finished = $p.WaitForExit(120000)
          if (-not $finished) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          if (Test-Path $out) {
            Get-Content $out -Encoding UTF8
            if (-not $finished -or $p.ExitCode -ne 0) { Write-Error "Dastur ishga tushdi, lekin self-test o'tmadi: $($p.ExitCode)"; exit 1 }
            Write-Host "Lotin bo'lmagan harfli papkadan ham ishladi."
          } else {
            Write-Host "::warning title=Lotin bo'lmagan harfli papka::Dastur bu papkadan ishga tushmadi (jpackage ishga tushirgichi, JDK-8205991; chiqish kodi: $(if ($finished) { $p.ExitCode } else { 'vaqt tugadi' })). README: bunday kompyuterda C:\ReaktivControl ga o'rnating."
          }
      - name: Install the MSI, self-test the installed app, uninstall
        shell: pwsh
        run: |
          $msi = (Get-ChildItem 'build/compose/binaries/main/msi/*.msi' | Select-Object -First 1).FullName
          $log = Join-Path $env:RUNNER_TEMP 'msi-install.log'
          $p = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/l*v', "`"$log`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 60; Write-Error "MSI o'rnatilmadi: $($p.ExitCode)"; exit 1 }
          $exe = Get-ChildItem -Path $env:LOCALAPPDATA, $env:ProgramFiles -Recurse -Depth 3 -Filter 'ReaktivControl.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Error "O'rnatilgan ReaktivControl.exe topilmadi"; exit 1 }
          Write-Host "O'rnatilgan: $($exe.FullName)"
          $out = Join-Path $env:RUNNER_TEMP 'selftest-installed.txt'
          $t = Start-Process -FilePath $exe.FullName -ArgumentList @('--self-test', "`"$out`"") -Wait -PassThru
          if (Test-Path $out) { Get-Content $out -Encoding UTF8 }
          if ($t.ExitCode -ne 0) { Write-Error "O'rnatilgan dastur self-test'dan o'tmadi: $($t.ExitCode)"; exit 1 }
          $u = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn') -Wait -PassThru
          if ($u.ExitCode -ne 0) { Write-Error "MSI o'chirilmadi: $($u.ExitCode)"; exit 1 }
      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path build/compose/binaries/main/app/ReaktivControl -DestinationPath build/ReaktivControl-portable.zip
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: ReaktivControl-Windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: ReaktivControl-Windows-portable
          # Papkaning o'zi: yuklab olingan zip ichida darhol ReaktivControl\ papkasi (zip ichida zip emas).
          path: desktop/build/compose/binaries/main/app/
          include-hidden-files: true
          if-no-files-found: error
      - name: Attach to release (desktop-v* tag)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/ReaktivControl-portable.zip
